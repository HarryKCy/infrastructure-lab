- import_playbook: guard.yml

- name: Verify baseline
  hosts: lab
  become: true
  tasks:
    - name: Check cloud-init result
      ansible.builtin.command: cloud-init status --long
      changed_when: false
    - name: Collect installed packages
      ansible.builtin.package_facts:
        manager: apt
    - name: Verify packages and hostname
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == inventory_hostname
          - "item in ansible_facts.packages"
      loop: [curl, dnsutils, iproute2, iputils-ping, openssh-server, python3, sudo, systemd-timesyncd]
    - name: Read effective SSH settings
      ansible.builtin.command: /usr/sbin/sshd -T
      register: ssh_settings
      changed_when: false
    - name: Verify effective SSH policy
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in ssh_settings.stdout_lines"
          - "'permitrootlogin no' in ssh_settings.stdout_lines"
          - "'kbdinteractiveauthentication no' in ssh_settings.stdout_lines"
    - name: Read synchronization state
      ansible.builtin.command: timedatectl show --property=NTPSynchronized --value
      register: synced
      changed_when: false
      failed_when: synced.stdout != 'yes'
    - name: Test communication between lab peers
      ansible.builtin.command:
        argv: [ping, -c, '1', -W, '3', '{{ hostvars[item].ansible_host }}']
      loop: '{{ groups.lab | difference([inventory_hostname]) }}'
      changed_when: false
- name: Verify Nginx package, service and listener on the web guest
  hosts: web
  become: true
  tasks:
    - name: Collect web packages and service status
      ansible.builtin.package_facts:
        manager: apt
    - name: Collect service state
      ansible.builtin.service_facts:
    - name: Verify Nginx installation and running service
      ansible.builtin.assert:
        that:
          - "'nginx' in ansible_facts.packages"
          - ansible_facts.services['nginx.service'].state == 'running'
          - ansible_facts.services['nginx.service'].status == 'enabled'
    - name: Verify TCP port 80 listener
      ansible.builtin.command:
        argv: [ss, -H, -ltn, 'sport = :80']
      register: nginx_listener
      changed_when: false
      failed_when: nginx_listener.rc != 0 or nginx_listener.stdout | length == 0
- name: Verify demonstration service from the host
  hosts: web
  gather_facts: false
  tasks:
    - name: Request health endpoint
      ansible.builtin.uri:
        url: 'http://{{ ansible_host }}/health'
        return_content: true
        use_proxy: false
        follow_redirects: none
        timeout: 10
      delegate_to: localhost
      register: health
      failed_when: >-
        health.status != 200 or health.content != 'Infrastructure Lab - OK\n' or
        health.x_infrastructure_lab_node | default('') != inventory_hostname
