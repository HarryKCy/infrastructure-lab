- import_playbook: guard.yml

- name: Wait for authenticated SSH and completed cloud-init
  hosts: lab
  gather_facts: false
  tasks:
    - name: Wait for SSH with strict host identity checking
      ansible.builtin.wait_for_connection:
        timeout: 300
    - name: Wait for cloud-init (nonzero status is a failure)
      ansible.builtin.command: cloud-init status --wait --long
      become: true
      changed_when: false
      async: 600
      poll: 5
    - name: Test Python and SSH transport
      ansible.builtin.ping:
