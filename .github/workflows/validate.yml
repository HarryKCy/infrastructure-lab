name: Static validation
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f  # v1
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - name: Install runner validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cloud-init python3-venv
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.lock.txt
      - name: Install pinned workflow validator
        run: scripts/install-actionlint.py
      - name: Validate without hypervisor access or deployment
        run: scripts/validate.sh
